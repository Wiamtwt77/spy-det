<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برا السالفة: كاشف ضد جاسوس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-purple-500 selection:text-white">

    <!-- Header / Branding -->
    <header class="w-full max-w-xl text-center py-4">
        <h1 class="text-4xl font-black bg-gradient-to-r from-purple-400 via-pink-500 to-cyan-400 bg-clip-text text-transparent drop-shadow-md">
            🕵️‍♂️ برا السالفة
        </h1>
        <p class="text-xs text-slate-400 mt-1 tracking-widest uppercase">النسخة المتقدمة: كاشف VS جاسوس (مدعوم بالذكاء الاصطناعي)</p>
    </header>

    <!-- Main Dynamic Screen Container -->
    <main id="app" class="w-full max-w-xl glass rounded-3xl p-6 shadow-2xl relative overflow-hidden my-auto">
        <!-- Screens will be injected here via JavaScript -->
    </main>

    <!-- Developer Credit Footer -->
    <footer class="w-full max-w-xl text-center py-4 border-t border-slate-800/60 mt-auto">
        <p class="text-sm font-semibold text-slate-400">
            👑 إعداد وتطوير المبدع: <span class="text-purple-400 font-bold text-base hover:text-cyan-400 transition-colors">توات سليسو</span>
        </p>
        <p class="text-xs text-slate-600 mt-0.5">جميع الحقوق محفوظة © 2026</p>
    </footer>

    <!-- Game Logic Script -->
    <script>
        // State Management
        let players = ["أحمد", "سارة", "محمد", "خالد"];
        let roles = {}; 
        let currentTopicData = null;
        let currentPlayerIndex = 0;
        let submittedHints = {};
        
        // Manual Sabotage System States
        let saboteurPlayer = null;    // اللاعب الممنوح قوة التخريب
        let sabotageTarget = null;    // الضحية المحددة
        let fakeHintText = "";        // التلميح المفبرك

        const app = document.getElementById('app');

        // Fisher-Yates True Random Shuffle Algorithm
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderSetup() {
            app.innerHTML = `
                <div class="space-y-6">
                    <div class="text-center">
                        <h2 class="text-2xl font-bold text-white mb-2">إعداد اللاعبين</h2>
                        <p class="text-xs text-slate-400">أدخل أسماء اللاعبين (3 إلى 8 لاعبين)</p>
                    </div>

                    <div class="space-y-3" id="players-list">
                        ${players.map((p, i) => `
                            <div class="flex items-center gap-2">
                                <input type="text" value="${p}" onchange="updatePlayerName(${i}, this.value)" 
                                    class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-purple-500 font-medium">
                                ${players.length > 3 ? `
                                    <button onclick="removePlayer(${i})" class="bg-red-500/20 text-red-400 p-2.5 rounded-xl hover:bg-red-500/30">✕</button>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="addPlayer()" class="w-full bg-slate-800 border border-dashed border-slate-600 hover:border-purple-500 text-slate-300 py-2.5 rounded-xl font-medium transition-all text-sm">
                        + إضافة لاعب آخر
                    </button>

                    <button id="start-btn" onclick="startGame()" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white font-bold py-3.5 rounded-2xl shadow-lg neon-glow-purple transition-all text-lg flex justify-center items-center gap-2">
                        <span>🚀 بدء الجولة</span>
                    </button>
                </div>
            `;
        }

        function updatePlayerName(i, name) { players[i] = name || `لاعب ${i+1}`; }
        function addPlayer() { if(players.length < 8) { players.push(`لاعب ${players.length + 1}`); renderSetup(); } }
        function removePlayer(i) { players.splice(i, 1); renderSetup(); }

        async function fetchAITopic() {
            try {
                const response = await fetch('/api/generate');
                if (!response.ok) throw new Error("فشل الاتصال بالذكاء الاصطناعي");
                return await response.json();
            } catch (err) {
                console.warn("استخدام موضوع احتياطي عند عدم توفر المفتاح:", err);
                return {
                    category: "مواقف طريفة",
                    topic: "واحد نسي مفتاحه داخل السيارة وهي شغالة",
                    spy_hint: "سهو واحتجاز",
                    mode: "NORMAL",
                    has_sabotage: true
                };
            }
        }

        async function startGame() {
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin">🤖</span> <span>توليد موضوع فريد عبر OP_KEY...</span>`;

            currentTopicData = await fetchAITopic();

            // Strict Randomization for Roles using Fisher-Yates
            const shuffledPlayers = shuffleArray(players);
            const spy = shuffledPlayers[0];
            const detector = shuffledPlayers[1];

            roles = {};
            players.forEach(p => {
                if (p === spy) roles[p] = 'SPY';
                else if (p === detector) roles[p] = 'DETECTOR';
                else roles[p] = 'CITIZEN';
            });

            // Sabotage system initialization
            saboteurPlayer = null;
            sabotageTarget = null;
            fakeHintText = "";

            if (currentTopicData.has_sabotage || Math.random() < 0.25) {
                const randomCandidates = shuffleArray(players);
                saboteurPlayer = randomCandidates[0]; // منح زر التخريب للاعب عشوائي تماماً
            }

            currentPlayerIndex = 0;
            submittedHints = {};
            renderRoleReveal();
        }

        function renderRoleReveal() {
            const player = players[currentPlayerIndex];
            const role = roles[player];

            app.innerHTML = `
                <div class="text-center space-y-6 py-4">
                    <span class="bg-purple-500/20 text-purple-300 text-xs font-bold px-3 py-1 rounded-full border border-purple-500/30">
                        مرحلة كشف الكروت
                    </span>
                    <h2 class="text-3xl font-black text-white">مرر الجهاز إلى: <span class="text-cyan-400">${player}</span></h2>
                    
                    <div id="card-content" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                        <p class="text-slate-400 text-sm">اضغط على الزر أدناه لإظهار بطاقتك السرية</p>
                        <button onclick="revealRole('${player}', '${role}')" class="bg-purple-600 text-white font-bold px-6 py-3 rounded-xl shadow-md hover:bg-purple-500">
                            👁️ كشف بطاقتي
                        </button>
                    </div>
                </div>
            `;
        }

        function revealRole(player, role) {
            const card = document.getElementById('card-content');
            let content = '';

            if (role === 'SPY') {
                content = `
                    <div class="space-y-3">
                        <span class="text-4xl">🥷</span>
                        <h3 class="text-2xl font-bold text-red-400">أنت الجاسوس!</h3>
                        <p class="text-xs text-slate-300">أنت خارج السالفة، لكن إليك تلميح أول للربط:</p>
                        <div class="bg-slate-950 p-3 rounded-xl border border-red-500/30">
                            <p class="text-xs text-slate-400">التصنيف: <b class="text-white">${currentTopicData.category}</b></p>
                            <p class="text-sm font-bold text-yellow-400 mt-1">تلميح الجاسوس: "${currentTopicData.spy_hint}"</p>
                        </div>
                    </div>
                `;
            } else if (role === 'DETECTOR') {
                content = `
                    <div class="space-y-3">
                        <span class="text-4xl">🕵️‍♂️</span>
                        <h3 class="text-2xl font-bold text-cyan-400">أنت الكاشف!</h3>
                        <p class="text-xs text-slate-300">تعرف السالفة ومهمتك كشف الجاسوس دون أن يعرف هويتك.</p>
                        <div class="bg-slate-950 p-3 rounded-xl border border-cyan-500/30">
                            <p class="text-xs text-slate-400">التصنيف: <b class="text-white">${currentTopicData.category}</b></p>
                            <p class="text-base font-black text-cyan-300 mt-1">الموضوع: ${currentTopicData.topic}</p>
                        </div>
                    </div>
                `;
            } else {
                content = `
                    <div class="space-y-3">
                        <span class="text-4xl">👥</span>
                        <h3 class="text-2xl font-bold text-emerald-400">أنت مواطن بريء</h3>
                        <p class="text-xs text-slate-300">ساعد الكاشف بتلميحات ذكية دون كشف الكلمة للجاسوس.</p>
                        <div class="bg-slate-950 p-3 rounded-xl border border-emerald-500/30">
                            <p class="text-xs text-slate-400">التصنيف: <b class="text-white">${currentTopicData.category}</b></p>
                            <p class="text-base font-black text-emerald-300 mt-1">الموضوع: ${currentTopicData.topic}</p>
                        </div>
                    </div>
                `;
            }

            if (currentTopicData.mode === 'EMOJI_ONLY') {
                content += `<p class="text-xs text-yellow-400 font-bold mt-2">⚠️ قانون الجولة: التلميح بـ الإيموجي فقط! 🥑</p>`;
            } else if (currentTopicData.mode === 'REVERSE_HINT') {
                content += `<p class="text-xs text-pink-400 font-bold mt-2">⚠️ قانون الجولة: التلميح بصفة **عكسية** ليست فيه!</p>`;
            }

            content += `
                <button onclick="nextRoleReveal()" class="w-full mt-4 bg-slate-800 text-slate-200 py-2.5 rounded-xl font-bold hover:bg-slate-700">
                    تم، إخفاء البطاقة 🔒
                </button>
            `;
            card.innerHTML = content;
        }

        function nextRoleReveal() {
            currentPlayerIndex++;
            if (currentPlayerIndex < players.length) {
                renderRoleReveal();
            } else {
                currentPlayerIndex = 0;
                renderHintInput();
            }
        }

        function renderHintInput() {
            const player = players[currentPlayerIndex];

            let html = `
                <div class="space-y-5 py-2">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span class="text-xs text-purple-400 font-bold">مرحلة إدخال التلميحات السرية</span>
                        <span class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-300">${currentPlayerIndex + 1} / ${players.length}</span>
                    </div>

                    <h2 class="text-2xl font-bold text-center text-white">دور اللاعب: <span class="text-purple-400">${player}</span></h2>
                    
                    <div class="space-y-3">
                        <label class="block text-xs text-slate-400 text-right">اكتب تلميحك السري:</label>
                        <input type="text" id="hint-input" placeholder="اكتب تلميحك هنا..." 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 font-medium text-center text-lg">
                    </div>
            `;

            // Display manual Sabotage interface if player has the sabotage power
            if (saboteurPlayer === player && !sabotageTarget) {
                const otherPlayers = players.filter(p => p !== player);
                html += `
                    <div class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl space-y-3 mt-4 text-right">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">🍆</span>
                            <p class="text-xs text-amber-300 font-bold">لديك قوة التخريب اليدوي! اختر الضحية واكتب التلميح المزيف الذي سيظهر باسمه:</p>
                        </div>
                        
                        <select id="sabotage-victim" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none">
                            <option value="">-- اختر الضحية --</option>
                            ${otherPlayers.map(p => `<option value="${p}">${p}</option>`).join('')}
                        </select>

                        <input type="text" id="sabotage-fake-text" placeholder="التلميح المزيف الذي سيظهر باسم الضحية..." 
                            class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none">
                    </div>
                `;
            }

            html += `
                    <button onclick="submitHint()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition-all shadow-md mt-2">
                        تأكيد وإرسال التلميح ➔
                    </button>
                </div>
            `;

            app.innerHTML = html;
        }

        function submitHint() {
            const player = players[currentPlayerIndex];
            const val = document.getElementById('hint-input').value.trim();

            if (!val) { alert("من فضلك أدخل تلميحك أولاً!"); return; }

            // Save actual player hint
            submittedHints[player] = val;

            // Handle custom manual sabotage assignment
            if (saboteurPlayer === player && !sabotageTarget) {
                const victimSelect = document.getElementById('sabotage-victim');
                const fakeInput = document.getElementById('sabotage-fake-text');

                if (victimSelect && victimSelect.value && fakeInput && fakeInput.value.trim()) {
                    sabotageTarget = victimSelect.value;
                    fakeHintText = fakeInput.value.trim();
                }
            }

            currentPlayerIndex++;
            if (currentPlayerIndex < players.length) {
                renderHintInput();
            } else {
                renderDiscussionBoard();
            }
        }

        function renderDiscussionBoard() {
            // Apply Fake Hint to Sabotaged Target if sabotage occurred
            if (sabotageTarget && fakeHintText) {
                submittedHints[sabotageTarget] = fakeHintText;
            }

            app.innerHTML = `
                <div class="space-y-6">
                    <div class="text-center border-b border-slate-800 pb-3">
                        <span class="bg-cyan-500/20 text-cyan-300 text-xs font-bold px-3 py-1 rounded-full border border-cyan-500/30">
                            مرحلة النقاش والتحليل 🗣️
                        </span>
                        <h2 class="text-xl font-bold text-white mt-2">لوحة التلميحات العامة</h2>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        ${players.map(p => `
                            <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl flex flex-col justify-between shadow-sm">
                                <span class="text-xs font-bold text-slate-400 mb-1">${p}</span>
                                <span class="text-base font-black text-purple-300 bg-slate-950/60 p-2 rounded-xl text-center border border-slate-800/80">
                                    "${submittedHints[p]}"
                                </span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="space-y-2 pt-2">
                        <button onclick="newHintRound()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-sm border border-slate-700">
                            🔄 جولة تلميح جديدة
                        </button>

                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="triggerSpyGuess()" class="bg-red-600/20 border border-red-500/40 text-red-300 hover:bg-red-600/30 font-bold py-3 rounded-xl text-xs">
                                🥷 تخمين الكاشف (خاص بالجاسوس)
                            </button>
                            <button onclick="triggerAccuse()" class="bg-cyan-600/20 border border-cyan-500/40 text-cyan-300 hover:bg-cyan-600/30 font-bold py-3 rounded-xl text-xs">
                                🕵️‍♂️ اتهام الجاسوس (الكاشف/تصويت)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function newHintRound() {
            currentPlayerIndex = 0;
            submittedHints = {};
            renderHintInput();
        }

        function triggerSpyGuess() {
            app.innerHTML = `
                <div class="space-y-4 text-center">
                    <h2 class="text-xl font-bold text-red-400">🥷 مرحلة تخمين الجاسوس!</h2>
                    <p class="text-xs text-slate-300">اختر الشخص الذي تعتقد أنه "الكاشف":</p>

                    <div class="space-y-2">
                        ${players.map(p => `
                            <button onclick="finishGameSpyGuess('${p}')" class="w-full bg-slate-900 border border-slate-700 text-white font-bold py-3 rounded-xl hover:border-red-500">
                                ${p}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function finishGameSpyGuess(selectedPlayer) {
            const detectorPlayer = Object.keys(roles).find(p => roles[p] === 'DETECTOR');
            const spyPlayer = Object.keys(roles).find(p => roles[p] === 'SPY');

            if (selectedPlayer === detectorPlayer) {
                renderResult(true, `🏆 فوز ساحق للجاسوس (${spyPlayer})! استطاع كشف المحقق (${detectorPlayer}) بنجاح!`);
            } else {
                renderResult(false, `❌ خطأ! الجاسوس أخطأ التخمين واختار (${selectedPlayer}). الكاشف الحقيقي هو (${detectorPlayer}). فوز المواطنين والكاشف!`);
            }
        }

        function triggerAccuse() {
            app.innerHTML = `
                <div class="space-y-4 text-center">
                    <h2 class="text-xl font-bold text-cyan-400">🕵️‍♂️ مرحلة اتهام الجاسوس!</h2>
                    <p class="text-xs text-slate-300">من هو الشخص المشتبه به كـ "جاسوس"؟</p>

                    <div class="space-y-2">
                        ${players.map(p => `
                            <button onclick="finishGameAccuse('${p}')" class="w-full bg-slate-900 border border-slate-700 text-white font-bold py-3 rounded-xl hover:border-cyan-500">
                                ${p}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function finishGameAccuse(selectedPlayer) {
            const spyPlayer = Object.keys(roles).find(p => roles[p] === 'SPY');

            if (selectedPlayer === spyPlayer) {
                renderResult(true, `🏆 فوز المحقق والمواطنين! تم كشف الجاسوس الحقيقي (${spyPlayer}) بنجاح!`);
            } else {
                renderResult(false, `❌ اتهام خاطئ! تم اتهام (${selectedPlayer}) البريء، بينما الجاسوس الحقيقي هو (${spyPlayer})! فوز الجاسوس!`);
            }
        }

        function renderResult(isSuccess, message) {
            app.innerHTML = `
                <div class="text-center space-y-6 py-4">
                    <div class="text-6xl">${isSuccess ? '🎉' : '💀'}</div>
                    <h2 class="text-2xl font-black ${isSuccess ? 'text-emerald-400' : 'text-red-400'}">نهاية الجولة</h2>
                    
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-slate-200 text-sm font-medium leading-relaxed">
                        ${message}
                    </div>

                    <div class="bg-slate-950/80 p-3 rounded-xl text-xs space-y-1 text-slate-400 border border-slate-800">
                        <p>الموضوع الأصلي: <b class="text-white">${currentTopicData.topic}</b></p>
                        <p>التصنيف: <b class="text-white">${currentTopicData.category}</b></p>
                    </div>

                    <button onclick="renderSetup()" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:opacity-90 transition-all">
                        🎮 جولة جديدة
                    </button>
                </div>
            `;
        }

        // Initialize App
        renderSetup();
    </script>
</body>
</html>
